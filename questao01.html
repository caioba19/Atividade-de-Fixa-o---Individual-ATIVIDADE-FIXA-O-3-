<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q01 — Sistema de Login Acadêmico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 360px; border: 1px solid #334155; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #38bdf8; }
    label { display: block; margin-bottom: .3rem; font-size: .85rem; color: #94a3b8; }
    input { width: 100%; padding: .65rem .9rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: .95rem; margin-bottom: 1rem; outline: none; transition: border .2s; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: .75rem; background: #38bdf8; color: #0f172a; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: background .2s; }
    button:hover { background: #7dd3fc; }
    .msg { margin-top: 1rem; padding: .7rem 1rem; border-radius: 8px; font-size: .9rem; display: none; }
    .msg.erro { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; display: block; }
    .msg.sucesso { background: #052e16; color: #86efac; border: 1px solid #14532d; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎓 Login Acadêmico</h1>
    <form id="loginForm">
      <label>Usuário</label>
      <input type="text" id="usuario" placeholder="Digite seu usuário">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha">
      <button type="submit">Entrar</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg  = document.getElementById('msg');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const usuario = document.getElementById('usuario').value.trim();
      const senha   = document.getElementById('senha').value.trim();

      msg.className = 'msg';

      if (!usuario || !senha) {
        msg.textContent = '⚠️ Preencha todos os campos antes de continuar.';
        msg.classList.add('erro');
        return;
      }

      msg.textContent = `✅ Login realizado com sucesso! Bem-vindo, ${usuario}.`;
      msg.classList.add('sucesso');
    });
  </script>
</body>
</html>
