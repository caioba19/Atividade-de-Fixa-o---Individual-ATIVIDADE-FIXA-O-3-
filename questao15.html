<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q15 — Sistema de Votação</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 440px; border: 1px solid #334155; }
    h1 { font-size: 1.4rem; margin-bottom: .3rem; color: #4ade80; }
    .sub { font-size: .8rem; color: #64748b; margin-bottom: 1.5rem; }
    .total-votos { text-align: right; font-size: .8rem; color: #64748b; margin-bottom: 1rem; }
    .candidato { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: .7rem; cursor: pointer; transition: border .2s; position: relative; }
    .candidato:hover { border-color: #4ade80; }
    .candidato.votado { border-color: #4ade80; background: #052e16; }
    .cand-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
    .cand-nome  { font-weight: 600; font-size: .95rem; }
    .cand-votos { font-size: .85rem; color: #64748b; }
    .cand-barra-fundo { height: 6px; background: #1e293b; border-radius: 3px; }
    .cand-barra { height: 6px; background: #4ade80; border-radius: 3px; width: 0%; transition: width .5s; }
    .tag-vencedor { font-size: .7rem; background: #14532d; color: #86efac; padding: .15rem .5rem; border-radius: 4px; display: none; }
    .btn-votar { margin-top: 1rem; width: 100%; padding: .75rem; background: #4ade80; color: #052e16; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; display: none; }
    .btn-votar:hover { background: #86efac; }
    .btn-reset { margin-top: .6rem; width: 100%; padding: .6rem; background: transparent; color: #64748b; border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-size: .85rem; }
    .btn-reset:hover { border-color: #f87171; color: #f87171; }
    .votou-msg { background: #052e16; border: 1px solid #14532d; border-radius: 8px; padding: .7rem 1rem; color: #86efac; font-size: .9rem; text-align: center; display: none; margin-top: .8rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🗳️ Votação — Representante de Turma</h1>
    <p class="sub">Selecione um candidato e clique em Votar.</p>
    <div class="total-votos" id="totalVotos">Total de votos: 0</div>

    <div id="listaCandidatos"></div>
    <button class="btn-votar" id="btnVotar">Votar</button>
    <div class="votou-msg" id="votouMsg"></div>
    <button class="btn-reset" id="btnReset">🔄 Reiniciar votação</button>
  </div>

  <script>
    const candidatos = [
      { nome: 'Ana Beatriz',  emoji: '👩‍💼', votos: 0 },
      { nome: 'Carlos Silva', emoji: '👨‍💼', votos: 0 },
      { nome: 'Mariana Costa',emoji: '👩‍🎓', votos: 0 },
      { nome: 'Rafael Souza', emoji: '👨‍🎓', votos: 0 },
    ];

    let selecionado = null;
    let votouIndex  = null;

    function totalVotos() {
      return candidatos.reduce((s, c) => s + c.votos, 0);
    }

    function renderizar() {
      const lista    = document.getElementById('listaCandidatos');
      const total    = totalVotos();
      const maxVotos = Math.max(...candidatos.map(c => c.votos));
      lista.innerHTML = '';

      candidatos.forEach(function(cand, i) {
        const porcentagem = total > 0 ? ((cand.votos / total) * 100).toFixed(1) : 0;
        const vencedor    = total > 0 && cand.votos === maxVotos;
        const div = document.createElement('div');
        div.className = 'candidato' + (selecionado === i ? ' votado' : '');
        div.innerHTML = `
          <div class="cand-header">
            <span class="cand-nome">${cand.emoji} ${cand.nome}</span>
            <span style="display:flex;gap:.5rem;align-items:center">
              <span class="tag-vencedor" style="display:${vencedor && total > 0 ? 'inline' : 'none'}">🏆 Liderando</span>
              <span class="cand-votos">${cand.votos} voto${cand.votos !== 1 ? 's' : ''} (${porcentagem}%)</span>
            </span>
          </div>
          <div class="cand-barra-fundo"><div class="cand-barra" style="width:${porcentagem}%"></div></div>
        `;
        if (votouIndex === null) {
          div.addEventListener('click', function() {
            selecionado = i;
            document.getElementById('btnVotar').style.display = 'block';
            renderizar();
          });
        }
        lista.appendChild(div);
      });

      document.getElementById('totalVotos').textContent = `Total de votos: ${total}`;
    }

    document.getElementById('btnVotar').addEventListener('click', function() {
      if (selecionado === null) return;
      candidatos[selecionado].votos++;
      votouIndex = selecionado;
      this.style.display = 'none';
      const msg = document.getElementById('votouMsg');
      msg.textContent = `✅ Voto registrado para ${candidatos[selecionado].nome}!`;
      msg.style.display = 'block';
      renderizar();
    });

    document.getElementById('btnReset').addEventListener('click', function() {
      candidatos.forEach(c => c.votos = 0);
      selecionado = null;
      votouIndex  = null;
      document.getElementById('btnVotar').style.display = 'none';
      document.getElementById('votouMsg').style.display = 'none';
      renderizar();
    });

    renderizar();
  </script>
</body>
</html>
