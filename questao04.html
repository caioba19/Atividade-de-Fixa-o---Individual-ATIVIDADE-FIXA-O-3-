<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q04 — Loja Virtual de Eletrônicos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 440px; border: 1px solid #334155; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #34d399; }
    .produto { background: #0f172a; border-radius: 10px; padding: 1.2rem; margin-bottom: 1rem; border: 1px solid #334155; }
    .produto-nome { font-weight: 600; margin-bottom: 1rem; color: #f1f5f9; }
    .linha { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; font-size: .9rem; }
    .linha label { color: #94a3b8; }
    input[type="number"] { width: 90px; padding: .4rem .6rem; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: .9rem; text-align: center; outline: none; }
    input[type="number"]:focus { border-color: #34d399; }
    .valor-unitario { color: #94a3b8; }
    .total-linha { margin-top: .5rem; padding-top: .8rem; border-top: 1px solid #334155; font-weight: 700; color: #34d399; font-size: 1rem; }
    .total-geral { background: #052e16; border: 1px solid #14532d; border-radius: 10px; padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: 700; color: #86efac; }
    .btn { margin-top: 1rem; width: 100%; padding: .75rem; background: #34d399; color: #052e16; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: #6ee7b7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛒 Loja de Eletrônicos</h1>

    <div class="produto" id="p1">
      <div class="produto-nome">📱 Smartphone Pro X</div>
      <div class="linha">
        <label>Quantidade:</label>
        <input type="number" class="qtd" min="0" value="1" data-preco="2499.90">
      </div>
      <div class="linha">
        <label>Valor unitário:</label>
        <span class="valor-unitario">R$ 2.499,90</span>
      </div>
      <div class="linha total-linha">
        <span>Subtotal:</span>
        <span class="subtotal">R$ 2.499,90</span>
      </div>
    </div>

    <div class="produto" id="p2">
      <div class="produto-nome">💻 Notebook UltraSlim</div>
      <div class="linha">
        <label>Quantidade:</label>
        <input type="number" class="qtd" min="0" value="1" data-preco="4799.00">
      </div>
      <div class="linha">
        <label>Valor unitário:</label>
        <span class="valor-unitario">R$ 4.799,00</span>
      </div>
      <div class="linha total-linha">
        <span>Subtotal:</span>
        <span class="subtotal">R$ 4.799,00</span>
      </div>
    </div>

    <div class="produto" id="p3">
      <div class="produto-nome">🎧 Headphone ANC 360</div>
      <div class="linha">
        <label>Quantidade:</label>
        <input type="number" class="qtd" min="0" value="1" data-preco="899.00">
      </div>
      <div class="linha">
        <label>Valor unitário:</label>
        <span class="valor-unitario">R$ 899,00</span>
      </div>
      <div class="linha total-linha">
        <span>Subtotal:</span>
        <span class="subtotal">R$ 899,00</span>
      </div>
    </div>

    <div class="total-geral">
      <span>💳 Total da compra:</span>
      <span id="totalGeral">R$ 8.197,90</span>
    </div>

    <button class="btn" id="btnComprar">Finalizar Compra</button>
  </div>

  <script>
    function formatarReais(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function calcularTotal() {
      const inputs = document.querySelectorAll('.qtd');
      let totalGeral = 0;

      inputs.forEach(function(input) {
        const qtd    = parseInt(input.value) || 0;
        const preco  = parseFloat(input.dataset.preco);
        const sub    = qtd * preco;
        totalGeral  += sub;
        input.closest('.produto').querySelector('.subtotal').textContent = formatarReais(sub);
      });

      document.getElementById('totalGeral').textContent = formatarReais(totalGeral);
    }

    document.querySelectorAll('.qtd').forEach(function(input) {
      input.addEventListener('change', calcularTotal);
    });

    document.getElementById('btnComprar').addEventListener('click', function() {
      const total = document.getElementById('totalGeral').textContent;
      alert(`Compra finalizada!\nTotal: ${total}\nObrigado pela preferência! 🎉`);
    });
  </script>
</body>
</html>
